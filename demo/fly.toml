# fly deploy reads this from the demo directory. The app name has to exist first:
#   fly apps create fulmine-demo
app = "fulmine-demo"
primary_region = "fra"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # a demo that takes ten seconds to wake up would prove the opposite of the point, so one
  # machine stays up rather than being stopped when idle
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
