name: Run tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    # the commit-msg hook catches this locally, but a hook can be skipped and the changelog and
    # the version bump are both derived from these messages
    commitlint:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - run: npm install --include=dev

            - name: Lint commit messages
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v3

            - name: Cache Node.js dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: "${{ matrix.node-version }}"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Run tests
              run: npm run test

            # the pure functions, which the comparison suite cannot reach: it runs each test
            # against Express and against this and compares the output, which says nothing about a
            # branch no request happens to take
            - name: Run unit tests
              run: npm run test:unit

            - name: Run type compatibility tests
              run: npm run test:types

            # a gate now that it reads zero. It stays a gate as `strict` is turned on one flag at
            # a time, so each flag lands with the count back at zero rather than accumulating
            - name: Type check the source
              run: npm run typecheck

    # Express's own suite, run against this project. A gate since the count reached 1130/0:
    # any failing test, any file without a result, or a moved express tag is red. Linux only:
    # the Windows exit hang the tool works around does not exist here
    express-suite:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v3

            - name: Cache Node.js dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Run Express's test suite against fulmine
              run: npm run test:express -- --ci
