name: Run tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

# nothing here writes to the repository: the coverage upload posts to Coveralls, not to GitHub
permissions:
    contents: read

jobs:
    # the commit-msg hook catches this locally, but a hook can be skipped and the changelog and
    # the version bump are both derived from these messages
    commitlint:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - run: npm install --include=dev

            - name: Lint commit messages
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v7

            - name: Cache Node.js dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v7
              with:
                  node-version: "${{ matrix.node-version }}"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Run tests
              run: npm run test

            # what the two arms wrote when they disagreed. A failure that only happens on a
            # platform nobody develops on is diagnosable from these two files and from nothing else
            - name: Keep what the arms wrote when they disagreed
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-failures-node-${{ matrix.node-version }}
                  path: test-failures/
                  if-no-files-found: ignore

            # the pure functions, which the comparison suite cannot reach: it runs each test
            # against Express and against this and compares the output, which says nothing about a
            # branch no request happens to take
            - name: Run unit tests
              run: npm run test:unit

            - name: Run type compatibility tests
              run: npm run test:types

            # a gate now that it reads zero. It stays a gate as `strict` is turned on one flag at
            # a time, so each flag lands with the count back at zero rather than accumulating
            - name: Type check the source
              run: npm run typecheck

    # Coverage over all three suites, with floors set just under where the number stands so a
    # change that walks away from tested ground is red. The lcov goes to Coveralls, which is
    # where the README badge reads from.
    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v7

            - name: Cache Node.js dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Collect coverage across the comparison, unit and Express suites
              run: npm run cover:full

            - name: Enforce the coverage floors
              run: npm run cover:check

            # best-effort: the badge reads from here, but the gate is the floors above, so a
            # Coveralls hiccup must not turn the build red
            - name: Publish to Coveralls
              continue-on-error: true
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info

    # A handful of fuzz rounds on a seed nobody chose, every push and every pull request.
    #
    # One run proves nothing; a few hundred runs walk over ground no hand written test was ever
    # going to reach, and every bug it has found so far was real. It is deliberately short, so it
    # costs a couple of minutes rather than an hour, and deliberately random, so the coverage
    # accumulates across pushes instead of repeating.
    #
    # A divergence turns this job red and prints the seed that reproduces it, along with the case
    # shrunk to the few lines worth pasting into tests/. Nothing here blocks a merge: read the
    # seed, replay it locally with `node tools/fuzz.js --seed N --rounds 1`, and decide whether it
    # is a bug or something the fuzzer needs taught.
    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v7

            - name: Cache Node.js dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Fuzz against Express on a random seed
              run: npm run fuzz -- --rounds 20

    # Express's own suite, run against this project. A gate since the count reached 1130/0:
    # any failing test, any file without a result, or a moved express tag is red. Linux only:
    # the Windows exit hang the tool works around does not exist here
    express-suite:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Source Tree
              uses: actions/checkout@v7

            - name: Cache Node.js dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node.js environment
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Run Express's test suite against fulmine
              run: npm run test:express -- --ci
