name: Benchmark Express Performance

on:
    push:
        branches: ["main"]
    pull_request:
        branches:
            - main

permissions: write-all

jobs:
    benchmark:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Cache Node.js dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Set up Node.js
              # Changing this moves every ratio in the summary without a line of this project
              # changing, because the other arm is node:http and node:http keeps getting faster:
              # the jump from 22 to 24 was Express roughly tripling on some scenarios, which read
              # as a regression here and was not one. Compare summaries across runs only when this
              # number is the same in both.
              uses: actions/setup-node@v3
              with:
                  node-version: "26"

            - name: Install dependencies
              run: npm install --include=dev

            - name: Run benchmark suite
              # without this, template engines run in debug mode and recompile the view on every
              # request, so engines/art measures the template compiler rather than either server.
              # set on the step, not the job, so npm install still pulls devDependencies
              env:
                  NODE_ENV: production
              run: npm run benchmark:compare -- --duration 20 --output benchmark_summary.md

            - name: Upload benchmark markdown artifact
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-summary
                  path: benchmark_summary.md

            - name: Comment on commit
              if: github.event_name == 'push'
              continue-on-error: true
              uses: peter-evans/commit-comment@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  body-path: benchmark_summary.md

            - name: Comment on pull request
              if: github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- benchmark-comment -->';
                      const body = fs.readFileSync('benchmark_summary.md', 'utf8');
                      const issue_number = context.payload.pull_request.number;

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number
                      });

                      const existing = comments.find((comment) =>
                        comment.user && comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number,
                          body
                        });
                      }
