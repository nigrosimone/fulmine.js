name: Benchmark Express Performance

on:
    push:
        branches: ["main"]
    pull_request:
        branches:
            - main
    # for the one question a scheduled run cannot answer: whether the loopback TCP stack is part of
    # what makes a row move ten percent between two runs of the same code. Dispatch it once each
    # way and compare the ratios, which is what the summary's own history section is for
    workflow_dispatch:
        inputs:
            transport:
                description: "What both arms are reached on"
                type: choice
                options: [tcp, unix-socket]
                default: tcp

# read by default, and the job below asks for the two writes it really makes
permissions:
    contents: read

jobs:
    benchmark:
        runs-on: ubuntu-latest
        permissions:
            # the commit comment on a push
            contents: write
            # and the one on a pull request, which is an issue comment
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Cache Node.js dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Set up Node.js
              # Changing this moves every ratio in the summary without a line of this project
              # changing, because the other arm is node:http and node:http keeps getting faster:
              # the jump from 22 to 24 was Express roughly tripling on some scenarios, which read
              # as a regression here and was not one. Compare summaries across runs only when this
              # number is the same in both.
              uses: actions/setup-node@v7
              with:
                  node-version: "26"

            - name: Install dependencies
              run: npm install --include=dev

            # the ratios the last green run on main measured, so this one can say what moved rather
            # than only what it is. Always main's, never the branch's: every run is read against the
            # same baseline. Best effort throughout - a first run, an expired artifact or a run that
            # never uploaded one all mean "nothing to compare against", which is not a failure
            - name: Fetch the previous run's ratios
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  previous=$(gh run list --workflow benchmark.yml --branch main --status success \
                      --limit 1 --json databaseId --jq '.[0].databaseId')
                  if [ -n "$previous" ]; then
                      gh run download "$previous" --name benchmark-history --dir . || true
                  fi
                  ls -l benchmark_history.json || echo "no history to compare against"

            - name: Run benchmark suite
              # without this, template engines run in debug mode and recompile the view on every
              # request, so engines/art measures the template compiler rather than either server.
              # set on the step, not the job, so npm install still pulls devDependencies
              env:
                  NODE_ENV: production
              run: |
                  npm run benchmark:compare -- --duration 20 --output benchmark_summary.md \
                      ${{ inputs.transport == 'unix-socket' && '--socket 1' || '' }}

            - name: Upload benchmark markdown artifact
              uses: actions/upload-artifact@v7
              with:
                  name: benchmark-summary
                  path: benchmark_summary.md

            # what the next run reads. Keyed by machine and major node inside, so a run only ever
            # compares itself against one that is comparable
            - name: Upload the ratios for the next run
              uses: actions/upload-artifact@v7
              with:
                  name: benchmark-history
                  path: benchmark_history.json
                  if-no-files-found: warn

            - name: Comment on commit
              if: github.event_name == 'push'
              continue-on-error: true
              uses: peter-evans/commit-comment@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  body-path: benchmark_summary.md

            - name: Comment on pull request
              if: github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- benchmark-comment -->';
                      const body = fs.readFileSync('benchmark_summary.md', 'utf8');
                      const issue_number = context.payload.pull_request.number;

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number
                      });

                      const existing = comments.find((comment) =>
                        comment.user && comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number,
                          body
                        });
                      }
